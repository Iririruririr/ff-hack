name: Build SBA Helper AI
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install web dependencies
        run: npm ci
      - name: Build web assets
        run: npm run build
      - name: Sync Capacitor Android project
        run: npx cap sync android
      - name: Build installable Android APK
        run: |
          set -o pipefail
          cd android
          ./gradlew --no-daemon assembleDebug --stacktrace --console=plain 2>&1 | tee ../gradle-build.log
      - name: Report Gradle diagnostics
        if: failure()
        run: |
          if [ -f gradle-build.log ]; then
            echo '## Android build log (last 80 lines)' >> "$GITHUB_STEP_SUMMARY"
            tail -n 80 gradle-build.log >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do echo "::error title=Gradle build::$line"; done < <(tail -n 40 gradle-build.log)
          fi
      - name: Upload Gradle diagnostics
        if: failure() && hashFiles('gradle-build.log') != ''
        uses: actions/upload-artifact@v7
        with:
          name: sba-helper-ai-gradle-log
          path: gradle-build.log
      - name: Upload web build and Android APK
        uses: actions/upload-artifact@v7
        with:
          name: sba-helper-ai-builds
          path: |
            dist/
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
